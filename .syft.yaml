# SBOM output configuration for release CI. Pin and record the Syft version
# in the release metadata before use. CI must create artifacts/sbom first.
output:
  - "cyclonedx-json=artifacts/sbom/PhotoSuite.cdx.json"
  - "spdx-json=artifacts/sbom/PhotoSuite.spdx.json"
check-for-app-update: false
format:
  pretty: true
file:
  metadata:
    selection: "owned-by-package"
    digests:
      - "sha256"
exclude:
  - "./artifacts/**"
